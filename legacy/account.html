<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원가입 · 내 계정</title>
  <link rel="stylesheet" href="/commerce.css">
  <script type="module" src="/account.js"></script>
</head>
<body class="account-page">
  <header>
    <a href="/">YOUR LABEL</a>
    <nav aria-label="계정 메뉴">
      <a id="orders-link" href="#orders">내 주문</a>
      <a href="/">쇼핑 계속하기</a>
      <a href="/signout-with-chatgpt?return_to=%2F" target="_top">로그아웃</a>
    </nav>
  </header>
  <main id="page-main" aria-busy="true">
    <p class="eyebrow" id="page-eyebrow">MY ACCOUNT</p>
    <h1 id="page-title">회원정보와 주문</h1>
    <p id="status" role="status" aria-live="polite">회원정보를 불러오는 중…</p>
    <div id="load-actions" class="actions" hidden>
      <button id="load-retry" type="button">다시 불러오기</button>
      <a id="load-login" class="text-link" href="/signup" hidden>ChatGPT로 다시 로그인</a>
    </div>
    <section id="profile" aria-labelledby="profile-title"></section>
    <section id="checkout"></section>
    <section id="orders"></section>
  </main>
  <dialog id="request-dialog">
    <form id="request-form">
      <h2 id="request-title"></h2>
      <label>요청 사유<textarea id="reason" required maxlength="500"></textarea></label>
      <div class="actions">
        <button type="button" id="close-dialog">닫기</button>
        <button class="primary">요청하기</button>
      </div>
      <p id="request-error" role="alert"></p>
    </form>
  </dialog>
</body>
</html>
