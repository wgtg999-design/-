<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-store-title="auth.entryDocumentTitle">로그인 / 회원가입 · YOUR LABEL</title>
  <link rel="stylesheet" href="/commerce.css">
  <script defer src="/i18n.js"></script>
  <script defer src="/customer-brand.js"></script>
</head>
<body class="signup-page">
  <header>
    <a href="/" data-store-brand>YOUR LABEL</a>
    <nav aria-label="회원 메뉴" data-i18n-aria-label="auth.nav"><a href="/" data-i18n="account.shop">쇼핑 계속하기</a></nav>
    <label class="language-control"><span data-i18n="common.language">언어</span><select data-language-select aria-label="언어" data-i18n-aria-label="common.language"><option value="ko">한국어</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option></select></label>
  </header>
  <main class="signup-intro">
    <p class="eyebrow">LOGIN / JOIN</p>
    <h1 data-i18n="auth.title">로그인 / 회원가입</h1>
    <p class="lead" data-i18n="auth.start">ChatGPT 계정으로 시작하세요.</p>
    <section aria-labelledby="signup-method-title">
      <h2 id="signup-method-title" data-i18n="auth.method">ChatGPT 계정 연동</h2>
      <p class="muted" data-i18n="auth.instructions">ChatGPT에 로그인한 뒤 이름·연락처를 입력하고 이용약관과 개인정보 안내에 동의하면 회원가입이 완료됩니다.</p>
      <p class="muted" data-i18n="auth.existing">이미 가입한 회원은 내 계정으로 연결됩니다. 별도 쇼핑몰 비밀번호는 만들지 않습니다.</p>
      <div id="public-policy-links" class="actions" hidden><a class="text-link" href="/policies/terms" data-i18n="auth.terms">이용약관</a><a class="text-link" href="/policies/privacy" data-i18n="auth.privacy">개인정보 안내</a></div>
      <a class="primary signup-start" href="__SIGN_IN_URL__" target="_top" data-i18n="auth.login">ChatGPT로 로그인 / 회원가입</a>
      <p class="signup-note" data-i18n="auth.linked">회원가입과 주문 내역은 로그인한 ChatGPT 계정에 연결됩니다.</p>
    </section>
    <a class="text-link" href="/" data-i18n="account.shop">쇼핑 계속하기</a>
  </main>
</body>
</html>
